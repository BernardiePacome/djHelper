name: CI

# Runs on pull requests and is reused by the CI / CD workflow (cd.yml) for pushes to main.
on:
  pull_request:
  workflow_call:
    inputs:
      publish:
        description: Upload the production web build as the GitHub Pages artifact.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: djHelperApp
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: djHelperApp/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test -- --watch=false

      - name: Build production app
        run: npm run build -- --base-href /djHelper/

      - name: Upload GitHub Pages artifact
        if: inputs.publish
        uses: actions/upload-pages-artifact@v3
        with:
          path: djHelperApp/dist/djHelperApp/browser/

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
