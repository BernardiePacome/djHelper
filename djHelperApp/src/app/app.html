<main class="djhelper-page">
  <section class="app-shell">
    <header class="topbar">
      <div>
        <p class="main-title">DJ Helper</p>
        <h1>RekordBox Cue Converter & playlist helper</h1>
      </div>
    </header>

    <app-cue-file-dropzone
      [fileName]="fileName()"
      [audioFileName]="audioFile()?.name ?? ''"
      [errorMessage]="errorMessage()"
      (filesSelected)="onFilesSelected($event)"
      (clearRequested)="clearPlaylist()"
    />

    @if (audioFile(); as selectedAudio) {
      <app-waveform [file]="selectedAudio" [trackMarkers]="trackMarkers()" />
    }
  </section>

  <section>
    @if (playlist().length > 0) {
      <app-track-list [tracks]="playlist()" />
      <app-playlist-output [tracks]="playlist()" />
    }
  </section>
</main>
