<main class="djhelper-page">
  <section class="app-shell">
    <header class="topbar">
      @if (isMockMode) {
        <button
          class="mock-load-button"
          type="button"
          [disabled]="isLoadingMockFiles()"
          (click)="loadMockFiles()"
        >
          {{ isLoadingMockFiles() ? 'Loading mock files…' : 'Load mock cue and audio' }}
        </button>
      }
      <span class="d-flex w-100">
        <p class="main-title">DJ Helper</p><p class="artist-name">by PACOME</p>
      </span>
    </header>

    @if (!isMockMode) {
      <app-cue-file-dropzone
        [fileName]="fileName()"
        [audioFileName]="audioFile()?.name ?? ''"
        [errorMessage]="errorMessage()"
        (filesSelected)="onFilesSelected($event)"
        (clearRequested)="clearPlaylist()"
      />
    } @else if (errorMessage()) {
      <p class="error-message" role="alert">{{ errorMessage() }}</p>
    }

    @if (audioFile(); as selectedAudio) {
      <app-waveform [file]="selectedAudio" [trackMarkers]="trackMarkers()" />
    }
  </section>

  <section>
    @if (playlist().length > 0) {
      <app-track-list [tracks]="playlist()" />
      <app-playlist-output [tracks]="playlist()" />
    }
  </section>
</main>
