<main class="djhelper-page">
  <section class="app-main">
    <header class="app-topbar">
      @if (isMockMode) {
        <button
          class="mock-load-button"
          type="button"
          [disabled]="isLoadingMockFiles()"
          (click)="loadMockFiles()"
        >
          {{ isLoadingMockFiles() ? 'Loading mock files…' : 'Load mock cue and audio' }}
        </button>
      }
      <div class="d-flex w-100 app-header">
        <span class="main-title">DJ ToolBox ϕ</span><span class="artist-name">© PACOME</span>
      </div>
    </header>
    <p>for rekordBox</p>
    <app-cue-file-dropzone
      [fileName]="fileName()"
      [audioFileName]="audioFile()?.name ?? ''"
      [errorMessage]="errorMessage()"
      (filesSelected)="onFilesSelected($event)"
      (clearRequested)="clearPlaylist()"
    />

    @if (audioFile(); as selectedAudio) {
      <app-waveform [file]="selectedAudio" [trackMarkers]="trackMarkers()" />
    }
  </section>

  <section>
    <app-search-bar (setLoaded)="onSavedSetLoaded($event)" />
  </section>

  <section>
    @if (playlist().length > 0) {
      <app-track-list [tracks]="playlist()" />
      <app-playlist-output
        [tracks]="playlist()"
        [canSave]="canSaveSet()"
        [isSaving]="isSavingSet()"
        [isSaved]="isCurrentSetSaved()"
        (saveRequested)="saveSet()"
      />
    }
  </section>

  <app-saved-sets (setLoaded)="onSavedSetLoaded($event)" />
  
  <section>® This product is register under  Registered under MIT liscense 2026</section>
</main>
