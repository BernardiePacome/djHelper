<section class="track-list-panel">
  <h2>
    <button
      type="button"
      class="collapse-toggle"
      [attr.aria-expanded]="isExpanded()"
      [attr.aria-controls]="listId"
      (click)="toggleExpanded()"
    >
      <svg
        class="collapse-arrow"
        [class.collapsed]="!isExpanded()"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M6 9l6 6 6-6" />
      </svg>
      Playlist
    </button>
  </h2>

  @if (isExpanded()) {
    <div class="track-list" [id]="listId">
      @for (track of tracks(); track track.title + track.artist; let index = $index) {
        <div class="track-row">
          <span>{{ index + 1 }}.</span>
          <span>{{ track.artist }} - {{ track.title }}</span>
          <button
            type="button"
            class="track-time"
            [disabled]="seekableTime(track) === undefined"
            [attr.aria-label]="
              'Jump to ' + track.artist + ' - ' + track.title + ' at ' + track.playTime
            "
            (click)="seekToTrack(track)"
          >
            {{ track.playTime }}
          </button>
        </div>
      }
    </div>
  }
</section>
