<section class="options-panel">
  <h2>Options</h2>
  <div class="options-row">
  <label class="fader">
    <span>Fade in / out</span>
    <input
      type="range"
      min="0"
      max="1"
      step="0.05"
      [value]="options.fadeSeconds()"
      (input)="onFadeInput($event)"
    />
    <output>{{ options.fadeSeconds().toFixed(2) }} s</output>
  </label>
  <div class="color-picker" role="radiogroup" aria-label="Waveform color">
    <span>Waveform color</span>
    @for (color of options.waveformColors; track color.value) {
      <button
        type="button"
        role="radio"
        class="swatch"
        [class.selected]="options.waveformColor() === color.value"
        [attr.aria-checked]="options.waveformColor() === color.value"
        [attr.aria-label]="color.name"
        [title]="color.name"
        [style.background]="color.value"
        (click)="options.waveformColor.set(color.value)"
      ></button>
    }
  </div>
  </div>
</section>
