<section class="options-panel">
  <h2>Options</h2>

  <label class="crossfader">
    <span>Crossfade</span>
    <span class="range-label">0s</span>
    <input
      type="range"
      min="0"
      [max]="playbackOptionsService.maxCrossfadeDuration"
      step="0.01"
      [value]="playbackOptionsService.crossfadeDuration()"
      (input)="onCrossfadeDurationInput($event)"
      aria-label="Crossfade duration in seconds"
    />
    <span class="range-label">{{ playbackOptionsService.maxCrossfadeDuration }}s</span>
    <output>{{ playbackOptionsService.crossfadeDuration().toFixed(2) }}s</output>
  </label>

  <div class="color-picker" role="radiogroup" aria-label="Waveform color">
    <span>Waveform color</span>
    @for (color of playbackOptionsService.waveformColors; track color.value) {
      <button
        type="button"
        role="radio"
        class="swatch"
        [class.selected]="playbackOptionsService.waveformColor() === color.value"
        [attr.aria-checked]="playbackOptionsService.waveformColor() === color.value"
        [attr.aria-label]="color.name"
        [title]="color.name"
        [style.background]="color.value"
        (click)="playbackOptionsService.waveformColor.set(color.value)"
      ></button>
    }
  </div>
</section>
