server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  location = / {
    return 302 /index.html?mock=1;
  }

  location ^~ /api/ {
    return 404;
  }

  location ^~ /mocks/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
